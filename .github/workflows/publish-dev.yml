name: Publish daily-checkin development distribution

on:
  push:
    tags:
      - 'daily-checkin-v*.dev*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - name: Verify tag and project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          prefix = 'daily-checkin-v'
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(pathlib.Path('./pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if tag != prefix + version or '.dev' not in version:
              raise SystemExit(f'tag {tag} does not match dev version {version}')
          PY
      - run: python -m build '.' --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: daily-checkin-distribution
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/daily-checkin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daily-checkin-distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install published dev package and verify imports
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PIP_INDEX_URL: https://pypi.org/simple
        run: |
          VERSION="${RELEASE_TAG#daily-checkin-v}"
          python -m pip install --pre --no-cache-dir "daily-checkin[workbuddy]==$VERSION"
          python -c "import importlib, importlib.metadata as m, os; name='daily-checkin'; expected=os.environ['RELEASE_TAG'].removeprefix('daily-checkin-v'); assert m.version(name)==expected; importlib.import_module('daily_checkin.trae_scheduler'); print(name, m.version(name))"
          python -m pip check
